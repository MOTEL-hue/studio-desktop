name: Windows installer

on:
  # מפעילים ידנית (Actions > Windows installer > Run workflow) ורושמים מספר גרסה, או בדחיפת תג v1.0.0
  workflow_dispatch:
    inputs:
      release_version:
        description: 'מספר גרסה לפרסום (למשל 1.0.1). ריק = בנייה בלי פרסום'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Set version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
      - name: Build installer and publish if requested
        shell: bash
        run: npx electron-builder --config electron-builder.yml --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release_version != '') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: studio-windows
          path: dist/*.exe
