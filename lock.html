<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>אולפן שידור</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#0e1117;color:#e8ecf3;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.box{width:min(380px,90vw);padding:26px;background:#171c26;border:1px solid #2d3748;border-radius:14px}h1{margin:0 0 8px;font-size:21px}p,small{color:#9aa4b5;line-height:1.6}input{width:100%;padding:10px;border-radius:8px;border:1px solid #2d3748;background:#0e1117;color:#fff;font-size:15px;box-sizing:border-box;margin:6px 0}button{margin-top:10px;padding:10px 18px;border:0;border-radius:8px;background:#22a45d;color:#fff;font-size:15px;cursor:pointer}button.g{background:#2d3748}.err{color:#ff8a8a;min-height:1.2em}</style></head>
<body><div class="box"><h1>🔒 אולפן שידור</h1><p>הקלידו את הסיסמה כדי להיכנס.</p>
<input id="p" type="password" autofocus placeholder="סיסמה"><button id="go">כניסה</button><p class="err" id="e"></p>
<small>שכחתם? סגרו את התוכנה ומחקו את הקובץ config.json בתיקייה %APPDATA%\Studio.</small></div>
<script>
const go=async()=>{const ok=await window.studioDesktop.unlock(document.getElementById('p').value);if(!ok){document.getElementById('e').textContent='הסיסמה שגויה';document.getElementById('p').select();}};
document.getElementById('go').onclick=go;document.getElementById('p').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script></body></html>
