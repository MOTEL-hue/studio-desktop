appId: il.motel.studio
productName: Studio
artifactName: StudioSetup.${ext}
directories:
  output: dist
  buildResources: buildResources
asarUnpack:
  - node_modules/ffmpeg-static/**
files:
  - main.js
  - preload.js
  - lock.html
  - setpass.html
  - update.html
  - app/**/*
  - package.json
win:
  target: nsis
  icon: buildResources/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: אולפן שידור
  runAfterFinish: true
  include: buildResources/installer.nsh
# לחיצה כפולה על קובץ פרויקט של אולפן ההקלטות פותחת אותו בתוכנה
fileAssociations:
  - ext: mzproj
    name: StudioMusicProject
    description: פרויקט אולפן הקלטות
    role: Editor
publish:
  - provider: github
    owner: MOTEL-hue
    repo: studio-desktop
    releaseType: release
